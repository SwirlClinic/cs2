// CoD-style arena — fast run-and-gun deathmatch.
// Movement (sprint + slide) is handled by the CodMovement plugin; tune it in
// addons/counterstrikesharp/configs/plugins/CodMovement/CodMovement.json.

mp_warmuptime 0
mp_free_armor 2
mp_respawn_immunitytime 2
mp_autoteambalance 1
mp_teammates_are_enemies 0
// Loadouts (CodLoadouts, !class) define the arsenal — buying is disabled
mp_buytime 0
mp_buy_anywhere 0
sv_alltalk 1
sv_deadtalk 1

// Custom weapon models are delivered by mounting a Workshop addon via
// mm_extra_addons in cfg/multiaddonmanager/multiaddonmanager.cfg (empty by
// default — see that file and the README for why, and how to add your own).
