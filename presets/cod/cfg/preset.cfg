// CoD-style arena — fast run-and-gun deathmatch.
// Movement (sprint + slide) is handled by the CodMovement plugin; tune it in
// addons/counterstrikesharp/configs/plugins/CodMovement/CodMovement.json.

mp_warmuptime 0
mp_free_armor 2
mp_respawn_immunitytime 2
mp_autoteambalance 1
mp_teammates_are_enemies 0
mp_buy_anywhere 1
sv_alltalk 1
sv_deadtalk 1

// ---- Custom weapon models / animations ----
// CS2 delivers custom weapon content as a Workshop addon that clients download
// and mount. MultiAddonManager (already installed) does this server-side:
// uncomment and set the Workshop ID(s) of a weapon-model addon, comma-separated.
// The map reloads once to precache the new content.
//   mm_extra_addons "0000000000"
//
// Note: Source 2 reliably supports swapping world/weapon *models* this way;
// full first-person viewmodel animation replacement generally requires the
// content to be authored as a Workshop addon with CS2 Workshop Tools. See README.
