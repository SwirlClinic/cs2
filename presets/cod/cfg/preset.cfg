// CoD-style arena — fast run-and-gun deathmatch.
// Movement (sprint + slide) is handled by the CodMovement plugin; tune it in
// addons/counterstrikesharp/configs/plugins/CodMovement/CodMovement.json.

mp_warmuptime 0
mp_free_armor 2
mp_respawn_immunitytime 2
mp_autoteambalance 1
mp_teammates_are_enemies 0
// Loadouts (CodLoadouts, !class) define the arsenal — buying is disabled
mp_buytime 0
mp_buy_anywhere 0
sv_alltalk 1
sv_deadtalk 1

// ---- Custom weapon models / animations ----
// CS2 delivers custom weapon content as a Workshop addon that clients download
// and mount; MultiAddonManager (installed) handles the download/mount/precache.
// 3236700393 = blue_archive_gun_model_pack (~16MB): custom models for ak47,
// awp, deagle, glock, xm1014, m4a1, mp7, and more. CodWeapons' ModelOverride
// entries point at its .vmdl paths. Add more addon IDs comma-separated.
mm_extra_addons "3236700393"
