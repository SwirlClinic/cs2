// MultiAddonManager config (exec'd by MAM at plugin load).
// mm_extra_addons downloads + mounts Workshop content addons server-side and
// pushes them to clients. Empty by default: raw "model pack" addons don't
// reliably client-mount here and give ERROR models, and they define no weapon
// subclasses. For genuine custom weapons, author a Workshop-Tools addon that
// defines weapon subclasses (vdata + models + animations), then set its id
// here and reference its subclasses in CodLoadouts WeaponCustoms.
mm_extra_addons ""
